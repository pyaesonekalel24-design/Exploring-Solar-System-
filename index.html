<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <meta name="theme-color" content="#050711">
  <title>Solar System — Flying Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="game">

    <div id="loading-screen" class="screen">
      <p>Loading…</p>
    </div>

    <section
      id="start-screen"
      class="screen"
      aria-labelledby="game-title"
      hidden
    >
      <div class="start-card">
        <h1 id="game-title">SOLAR SYSTEM</h1>

        <button
          id="start-button"
          type="button"
        >
          START FLYING
        </button>
      </div>
    </section>

    <div id="error-screen" class="screen" hidden>
      <div class="start-card">
        <h1>Unable to start</h1>

        <p id="error-message">
          The 3D scene could not be loaded.
        </p>
      </div>
    </div>

    <div
      id="planet-label-layer"
      aria-hidden="true"
    ></div>

    <div id="game-ui" hidden>

      <!-- ===================================================
           MAIN HUD
           =================================================== -->

      <div id="helper-ui">

        <!-- ENERGY -->
        <div
          id="energy-hud"
          aria-label="Energy"
        >
          <div
            id="energy-bar"
            role="progressbar"
            aria-label="Energy"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="100"
          >
            <div id="energy-fill"></div>
          </div>

          <span id="energy-percent">100%</span>
        </div>


        <!-- SPEED MODES -->
        <div
          id="speed-panel"
          aria-label="Flying mode"
        >
          <button
            class="speed-button is-selected"
            type="button"
            data-speed="chill"
            aria-pressed="true"
          >
            CHILL
          </button>

          <button
            class="speed-button"
            type="button"
            data-speed="superman"
            aria-pressed="false"
          >
            SUPERMAN
          </button>

          <button
            class="speed-button"
            type="button"
            data-speed="creator"
            aria-pressed="false"
          >
            CREATOR
          </button>
        </div>


        <!-- UI OPTIONS -->
        <div
          id="visual-panel"
          aria-label="Visual settings"
          hidden
        >
          <div class="visual-panel-title">
            DISPLAY
          </div>

          <button
            class="visual-button"
            id="labels-toggle"
            type="button"
            aria-pressed="true"
          >
            <span>LABEL</span>
            <span class="toggle-state">ON</span>
          </button>

          <button
            class="visual-button"
            id="orbits-toggle"
            type="button"
            aria-pressed="true"
          >
            <span>ORBIT</span>
            <span class="toggle-state">ON</span>
          </button>

          <button
            class="visual-button"
            id="distance-toggle"
            type="button"
            aria-pressed="true"
          >
            <span>DISTANCE</span>
            <span class="toggle-state">ON</span>
          </button>

          <button
            class="visual-button cinematic-button"
            id="cinematic-toggle"
            type="button"
            aria-pressed="false"
          >
            <span>CINEMATIC</span>
            <span class="toggle-state">OFF</span>
          </button>
        </div>

      </div>


      <!-- ===================================================
           UI BUTTON
           =================================================== -->

      <button
        id="ui-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="visual-panel"
      >
        UI
      </button>


      <!-- ===================================================
           FLIGHT CONTROLS
           ALWAYS VISIBLE
           =================================================== -->

      <div
        id="controls"
        aria-label="Flight controls"
      >

        <div
          class="movement-pad"
          aria-label="Horizontal movement"
        >

          <button
            class="control-button forward-button"
            type="button"
            data-control="forward"
            aria-label="Forward"
          >
            <span class="arrow-icon arrow-up"></span>
          </button>

          <button
            class="control-button left-button"
            type="button"
            data-control="left"
            aria-label="Left"
          >
            <span class="arrow-icon arrow-left"></span>
          </button>

          <button
            class="control-button back-button"
            type="button"
            data-control="back"
            aria-label="Back"
          >
            <span class="arrow-icon arrow-down"></span>
          </button>

          <button
            class="control-button right-button"
            type="button"
            data-control="right"
            aria-label="Right"
          >
            <span class="arrow-icon arrow-right"></span>
          </button>

        </div>


        <div
          class="vertical-pad"
          aria-label="Vertical movement"
        >

          <button
            class="control-button"
            type="button"
            data-control="up"
            aria-label="Up"
          >
            <span class="arrow-icon arrow-double-up"></span>
          </button>

          <button
            class="control-button"
            type="button"
            data-control="down"
            aria-label="Down"
          >
            <span class="arrow-icon arrow-double-down"></span>
          </button>

        </div>

      </div>

    </div>

  </main>

  <script
    type="module"
    src="app.js"
  ></script>
</body>
</html>
