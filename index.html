<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050711">
  <title>Solar System — Flying Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <div id="loading-screen" class="screen">
      <p>Loading Solar System…</p>
    </div>

    <section id="start-screen" class="screen" aria-labelledby="game-title" hidden>
      <div class="start-card">
        <h1 id="game-title">SOLAR SYSTEM</h1>
        <p>Fly through the Solar System</p>
        <button id="start-button" type="button">START FLYING</button>
        <p class="help-text">
          Drag to look around. Use the on-screen buttons to fly.
          On desktop, use WASD, Space, and Shift.
        </p>
      </div>
    </section>

    <div id="error-screen" class="screen" hidden>
      <div class="start-card">
        <h1>Unable to start</h1>
        <p id="error-message">The 3D scene could not be loaded.</p>
        <p class="help-text">Try opening this page in an up-to-date browser with WebGL enabled.</p>
      </div>
    </div>

    <div id="planet-label-layer" aria-hidden="true"></div>

    <div id="game-ui" hidden>
      <div id="helper-ui">
        <div id="energy-hud" aria-label="Energy">
          <div
            id="energy-bar"
            role="progressbar"
            aria-label="Energy"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="100"
          >
            <div id="energy-fill"></div>
          </div>
          <span id="energy-percent">100%</span>
        </div>

        <div id="speed-panel" aria-label="Flying speed">
          <button class="speed-button is-selected" type="button" data-speed="chill" aria-pressed="true">
            CHILL
          </button>

          <button class="speed-button" type="button" data-speed="sonic" aria-pressed="false">
            SONIC
          </button>

          <button class="speed-button poop-button" type="button" data-speed="poop" aria-pressed="false">
            <span>U NEED TO</span>
            <span>POOP</span>
          </button>
        </div>
      </div>

      <button id="ui-toggle" type="button" aria-pressed="false">UI OFF</button>

      <div id="controls" aria-label="Flight controls">
        <div class="movement-pad" aria-label="Horizontal movement">
          <button class="control-button forward-button" type="button" data-control="forward" aria-label="Forward">FORWARD</button>
          <button class="control-button left-button" type="button" data-control="left" aria-label="Left">LEFT</button>
          <button class="control-button back-button" type="button" data-control="back" aria-label="Back">BACK</button>
          <button class="control-button right-button" type="button" data-control="right" aria-label="Right">RIGHT</button>
        </div>

        <div class="vertical-pad" aria-label="Vertical movement">
          <button class="control-button" type="button" data-control="up" aria-label="Up">UP</button>
          <button class="control-button" type="button" data-control="down" aria-label="Down">DOWN</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
