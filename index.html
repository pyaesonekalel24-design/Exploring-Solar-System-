<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />

  <title>Solar System Flight</title>

  <link
    rel="stylesheet"
    href="./style.css"
  />
</head>

<body>

  <div id="loading-screen">
    <div class="loading-title">
      SOLAR SYSTEM
    </div>

    <div class="loading-subtitle">
      Loading the universe...
    </div>
  </div>


  <div id="start-screen" hidden>
    <div class="start-card">

      <div class="start-title">
        SOLAR SYSTEM
      </div>

      <div class="start-subtitle">
        Fly through the real-time Solar System
      </div>

      <button id="start-button">
        ENTER SYSTEM
      </button>

    </div>
  </div>


  <div id="error-screen" hidden>
    <div class="error-card">

      <div class="error-title">
        SYSTEM ERROR
      </div>

      <div id="error-message"></div>

    </div>
  </div>


  <div id="game">

    <div id="planet-label-layer"></div>


    <div id="game-ui">

      <div id="top-ui">

        <button
          id="ui-toggle"
          class="ui-button"
          type="button"
        >
          MENU
        </button>

        <button
          id="north-button"
          class="ui-button"
          type="button"
        >
          NORTH
        </button>

      </div>


      <div id="ui-menu">

        <button
          id="labels-toggle"
          class="menu-button"
          type="button"
        >
          Labels
        </button>

        <button
          id="orbits-toggle"
          class="menu-button"
          type="button"
        >
          Orbits
        </button>

        <button
          id="distance-toggle"
          class="menu-button"
          type="button"
        >
          Distance
        </button>

        <button
          id="cinematic-toggle"
          class="menu-button"
          type="button"
        >
          Cinematic
        </button>

      </div>


      <div id="speed-controls">

        <button
          class="speed-button"
          data-speed="chill"
          type="button"
        >
          CHILL
        </button>

        <button
          class="speed-button"
          data-speed="superman"
          type="button"
        >
          SUPERMAN
        </button>

        <button
          class="speed-button"
          data-speed="creator"
          type="button"
        >
          CREATOR
        </button>

      </div>


      <div id="energy-container">

        <div id="energy-label">
          ENERGY
        </div>

        <div id="energy-bar">
          <div id="energy-fill"></div>
        </div>

        <div id="energy-percent">
          100%
        </div>

      </div>


      <!-- =================================================
           FLIGHT CONTROLS
           ================================================= -->

      <div id="controls">

        <!-- ANALOG FLIGHT JOYSTICK -->

        <div
          id="movement-joystick"
          class="movement-joystick"
          aria-label="Flight joystick"
        >

          <div class="joystick-base">

            <div
              id="joystick-thumb"
              class="joystick-thumb"
            ></div>

          </div>

        </div>


        <!-- VERTICAL MOVEMENT -->

        <div class="vertical-pad">

          <button
            class="control-button vertical-button up-button"
            data-control="up"
            type="button"
            aria-label="Move up"
          >
            <span class="arrow-icon arrow-up"></span>
          </button>

          <button
            class="control-button vertical-button down-button"
            data-control="down"
            type="button"
            aria-label="Move down"
          >
            <span class="arrow-icon arrow-down"></span>
          </button>

        </div>

      </div>

    </div>

  </div>


  <script type="module" src="./app.js"></script>

</body>
</html>
